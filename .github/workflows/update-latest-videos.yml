name: Update latest videos

# Once a day, refresh the "Behind the craft" (Inside ACC) row and the
# "Latest from The Grim Script" strip from the channels' public YouTube RSS
# feeds. No API key, no quota. It commits only when something changed.
# Rules (counts, exclusions, labels) live in .github/latest-videos.config.json.

on:
  schedule:
    - cron: "37 10 * * *" # 10:37 UTC, about 6:37 a.m. in Ontario
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-latest-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Refresh video rows from YouTube RSS
        id: refresh
        run: python3 .github/scripts/update_latest_videos.py

      - name: Commit and push if anything changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3; do
            if [ -z "$(git status --porcelain)" ]; then
              echo "Nothing changed."
              exit 0
            fi
            git add -A
            git commit -m "Update latest videos from YouTube RSS"
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (try $try); rebuilding the rows on top of the latest main."
            sleep $((try * 10))
            git fetch origin main
            git reset --hard origin/main
            python3 .github/scripts/update_latest_videos.py
          done
          exit 1

      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" --silent

      - name: Flag unreadable feeds
        if: steps.refresh.outputs.feeds_failed != '0'
        run: |
          echo "::error::${{ steps.refresh.outputs.feeds_failed }} YouTube RSS feed(s) could not be read, so those rows were not refreshed. Nothing on the site was removed. If this lasts more than a few days, a new long-form upload can fall out of the feed before it is seen: add it by hand to .github/latest-videos.state.json (see README)."
          exit 1
